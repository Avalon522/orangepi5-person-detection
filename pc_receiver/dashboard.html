<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>区域人员监测</title>
<style>body{margin:0;background:#0b111c;color:#fff;font:16px system-ui}main{max-width:1120px;margin:auto;padding:32px 22px}header{display:flex;justify-content:space-between;color:#9baac0;font-size:14px}h1{font-size:18px;font-weight:500}#state{font-size:clamp(26px,4vw,46px);margin:24px 0 10px;font-weight:800}.occupied{color:#ff454f}.unknown{color:#f3bf65}#detail{color:#9baac0;margin-bottom:24px}.hero{background:#131e2e;border:1px solid #29364a;border-radius:18px;overflow:hidden}#latest{width:100%;height: min(57vh,560px);object-fit:contain;display:block;background:#070c14}.caption{padding:18px 24px;color:#aab9cc}#placeholder{padding:100px 20px;text-align:center;color:#9baac0}h2{font-size:18px;margin-top:38px;color:#aab9cc}#history{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}article{background:#131e2e;border-radius:12px;overflow:hidden;color:#aab9cc;font-size:13px}article img{width:100%;height:140px;object-fit:cover}article p{margin:12px}footer{color:#76869e;font-size:12px;margin:28px 0}</style>
<main><header><h1>区域人员监测 / Orange Pi 5</h1><span id="connection">正在连接</span></header><div id="state" class="unknown">等待检测状态</div><div id="detail">尚未收到开发板状态</div><section class="hero"><div id="placeholder">等待第一张报警截图</div><img id="latest" hidden alt="当前检测画面"><div class="caption" id="caption">当前检测画面</div></section><h2>历史报警</h2><div id="history"></div><footer>历史记录保存在电脑 · 此页面展示最近 100 条 · 每次进入只记录首帧 · 画面始终实时更新，只有进入事件写入历史</footer></main>
<script>
const $=id=>document.getElementById(id);let signature='';
async function get(path){const r=await fetch(path,{cache:'no-store',signal:AbortSignal.timeout(4000)});if(!r.ok)throw Error(r.status);return r.json()}
function text(parent,t){const p=document.createElement('p');p.textContent=t;parent.appendChild(p)}
async function refresh(){try{const [s,events]=await Promise.all([get('/api/status'),get('/api/events')]);$('connection').textContent='接收服务在线';$('state').className=s.online?(s.person_count>0?'occupied':''):'unknown';$('state').textContent=!s.online?'检测设备离线 / 状态未知':s.person_count>0?'当前区域有人员进入':'当前区域没有人员进入';$('detail').textContent=s.online?'当前检测人数：'+s.person_count+' · 状态更新时间：'+s.received_at:'未收到有效心跳，不将设备离线判断为无人';if(s.online){$('placeholder').hidden=true;$('latest').hidden=false;$('latest').style.display='block';if(!$('latest').getAttribute('src'))$('latest').src='/live.mjpg';$('caption').textContent=s.person_count>0?'当前检测画面 · 持续更新':'当前检测画面 · 持续更新 · 当前无人'}else{$('latest').removeAttribute('src');$('latest').style.display='none';$('placeholder').hidden=false;$('placeholder').textContent='等待开发板画面'}const key=JSON.stringify(events);if(key!==signature){const real=events.filter(e=>!e.test);$('history').replaceChildren();for(const e of real){const card=document.createElement('article');if(e.image_url){const img=document.createElement('img');img.src=e.image_url;img.loading='lazy';img.alt='历史报警截图';card.appendChild(img)}text(card,e.received_at);text(card,e.person_count+' 人 · '+(e.max_confidence*100).toFixed(1)+'%');$('history').appendChild(card)}signature=key}}catch(e){$('connection').textContent='连接失败';$('state').className='unknown';$('state').textContent='接收服务离线 / 状态未知';$('detail').textContent='正在自动重连，已有截图继续保留'}finally{setTimeout(refresh,500)}}$('latest').style.display='none';refresh();
</script></html>
